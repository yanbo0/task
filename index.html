<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ 任务协作平台（YesApi）</title>
    <style>
        /* ===== 样式与前一致，为节省篇幅略，实际使用请保留完整样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #edf2f7 100%);
            color: #1a202c;
            min-height: 100vh;
            padding: 28px 28px 120px 28px;
            line-height: 1.6;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1::before {
            content: "✨";
            -webkit-text-fill-color: initial;
            color: #fbbf24;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fff;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf2;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
            transform: translateY(-3px) scale(1.02);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
            transform: translateY(-3px) scale(1.02);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
            transform: translateY(-3px) scale(1.02);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #d1d9e6;
            color: #334155;
        }
        .btn-outline:hover {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.06);
            color: #4f46e5;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .btn-xs {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            color: #0f172a;
        }
        .section-title .badge {
            font-size: 14px;
            font-weight: 500;
            background: #e2e8f0;
            padding: 4px 16px;
            border-radius: 40px;
            color: #475569;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #d1d9e6;
        }
        .section-title .search-wrap {
            flex: 1;
            text-align: right;
            min-width: 160px;
        }
        .section-title .search-wrap input {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #d1d9e6;
            font-size: 14px;
            width: 100%;
            max-width: 260px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            transition: border-color 0.2s;
        }
        .section-title .search-wrap input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }
        .group-title {
            grid-column: 1 / -1;
            font-size: 18px;
            font-weight: 700;
            margin: 16px 0 8px 0;
            color: #0f172a;
            padding-left: 8px;
            border-left: 4px solid #7c3aed;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 24px 26px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.07);
            border-color: #cbd5e1;
        }
        .project-card .p-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .project-card .p-meta {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .project-card .p-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .project-card .p-req {
            margin-top: 14px;
            padding: 14px 18px;
            background: rgba(241, 245, 249, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            font-size: 14px;
            color: #334155;
            border-left: 4px solid #a78bfa;
            word-break: break-word;
        }
        .project-card .p-status {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 16px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }
        .status-pending {
            background: #fef9c3;
            color: #854d0e;
            border: 1px solid #fde68a;
        }
        .status-open {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .status-closed {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .status-undefined {
            background: #e2e8f0;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .project-card .p-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 2px dashed #d1d9e6;
        }
        .empty-state .emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 18px;
            font-weight: 500;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 36px 40px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #0f172a;
        }
        .modal .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal .close-btn:hover {
            color: #1e293b;
            background: #f1f5f9;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #1e293b;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background: #fafcff;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .modal-actions {
            display: flex;
            gap: 14px;
            margin-top: 30px;
            justify-content: flex-end;
        }
        .小人区域 {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
        }
        .小人面板 {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 20px 24px 16px 24px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            max-width: 380px;
            width: 100%;
            transition: all 0.3s;
        }
        .小人面板 .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .小人面板 .panel-header span {
            font-weight: 700;
            font-size: 16px;
            color: #0f172a;
        }
        .小人面板 .panel-header .badge-count {
            background: #e9edf2;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .小人列表 {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .小人标签 {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px 6px 14px;
            background: #f1f5f9;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            user-select: none;
            color: #1e293b;
        }
        .小人标签:hover {
            background: #e2e8f0;
            transform: scale(1.05);
            border-color: #cbd5e1;
        }
        .小人标签 .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .小人操作栏 {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .task-list-modal .modal {
            max-width: 680px;
        }
        .task-group-title {
            font-size: 16px;
            font-weight: 700;
            margin: 12px 0 8px 0;
            color: #1e293b;
            padding: 6px 12px;
            background: #e9edf2;
            border-radius: 40px;
            display: inline-block;
        }
        .task-item {
            padding: 16px 20px;
            background: #f8fafc;
            border-radius: 18px;
            margin-bottom: 12px;
            border-left: 5px solid #7c3aed;
            transition: all 0.2s;
            cursor: pointer;
        }
        .task-item:hover {
            background: #f1f5f9;
            transform: translateX(4px);
        }
        .task-item .task-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .task-item .task-from {
            font-weight: 600;
            color: #4f46e5;
            font-size: 14px;
        }
        .task-item .task-deadline {
            font-size: 13px;
            color: #64748b;
        }
        .task-item .task-content {
            margin-top: 8px;
            font-size: 15px;
            color: #1e293b;
            word-break: break-word;
        }
        .task-item .task-status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 40px;
            background: #e2e8f0;
            color: #475569;
        }
        .task-item .task-status-badge.done {
            background: #dcfce7;
            color: #166534;
        }
        .task-detail-popup {
            margin-top: 12px;
            padding: 16px 18px;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            display: none;
        }
        .task-detail-popup.open {
            display: block;
        }
        .task-detail-popup .label {
            font-weight: 600;
            color: #475569;
        }
        .toast {
            position: fixed;
            bottom: 130px;
            right: 30px;
            background: #1e293b;
            color: #fff;
            padding: 16px 28px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .toast.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .toast.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        @media (max-width: 640px) {
            body {
                padding: 16px 16px 120px 16px;
            }
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header-actions {
                justify-content: stretch;
            }
            .header-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .modal {
                padding: 28px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .project-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .project-card {
                padding: 18px 20px;
            }
            .小人面板 {
                max-width: 320px;
                padding: 16px 18px;
            }
            .小人区域 {
                bottom: 16px;
                right: 16px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .section-title {
                font-size: 19px;
                flex-direction: column;
                align-items: stretch;
            }
            .section-title .search-wrap {
                text-align: left;
            }
            .section-title .search-wrap input {
                max-width: 100%;
            }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .status-indicator {
            font-size: 13px;
            background: #22c55e;
            color: #fff;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-left: 10px;
        }
        .status-indicator.offline {
            background: #f59e0b;
        }
        .status-indicator.error {
            background: #ef4444;
        }
    </style>
</head>
<body>

    <!-- ===== 应用主体 ===== -->
    <div class="app" id="app">
        <header class="header">
            <h1>任务协作平台 <span class="status-indicator" id="syncStatus">🟢 在线</span></h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showModal('projectModal')">➕ 发布项目</button>
            </div>
        </header>

        <div>
            <div class="section-title">
                <span>📌 项目大屏</span>
                <span class="badge" id="projectCount">0 个项目</span>
                <div class="search-wrap">
                    <input type="text" id="projectSearch" placeholder="🔍 搜索项目名称..." />
                </div>
            </div>
            <div class="project-grid" id="projectGrid">
                <div class="empty-state">
                    <span class="emoji">📭</span>
                    <p>暂无项目，点击「发布项目」创建第一个</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 虚拟小人区域 ===== -->
    <div class="小人区域" id="小人区域">
        <div class="小人面板" id="小人面板">
            <div class="panel-header">
                <span>🧑‍🤝‍🧑 虚拟小人</span>
                <span class="badge-count" id="小人Count">0</span>
            </div>
            <div class="小人列表" id="小人列表"></div>
            <div class="小人操作栏">
                <button class="btn btn-sm btn-outline" onclick="showModal('小人Modal')">✏️ 管理</button>
                <button class="btn btn-sm btn-primary" onclick="showModal('taskModal')">📨 发任务</button>
                <button class="btn btn-sm btn-success" onclick="showModal('taskListModal')">📋 任务清单</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：发布项目 ===== -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal">
            <h2>
                📌 发布项目
                <button class="close-btn" onclick="hideModal('projectModal')">✕</button>
            </h2>
            <form id="projectForm" onsubmit="App.submitProject(event)">
                <div class="form-group">
                    <label>项目名称 *</label>
                    <input type="text" id="pName" placeholder="例如：年度科研申报" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>申报开始时间</label>
                        <input type="datetime-local" id="pStart" />
                    </div>
                    <div class="form-group">
                        <label>申报结束时间</label>
                        <input type="datetime-local" id="pEnd" />
                    </div>
                </div>
                <div class="form-group">
                    <label>硬性要求</label>
                    <textarea id="pReq" placeholder="例如：需具备副高职称、近三年发表论文2篇以上"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="hideModal('projectModal')">取消</button>
                    <button type="submit" class="btn btn-primary">发布</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== 模态框：管理小人 ===== -->
    <div class="modal-overlay" id="小人Modal">
        <div class="modal">
            <h2>
                🧑‍🤝‍🧑 管理小人
                <button class="close-btn" onclick="hideModal('小人Modal')">✕</button>
            </h2>
            <div id="小人管理列表" style="margin-bottom:18px;"></div>
            <div class="form-group">
                <label>新增小人名称</label>
                <div style="display:flex;gap:12px;">
                    <input type="text" id="new小人Name" placeholder="例如：e" style="flex:1;" />
                    <button class="btn btn-success" onclick="App.addPerson()">➕ 添加</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="hideModal('小人Modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：发送任务 ===== -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2>
                📨 发送任务
                <button class="close-btn" onclick="hideModal('taskModal')">✕</button>
            </h2>
            <form id="taskForm" onsubmit="App.submitTask(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>发送者 (身份) *</label>
                        <select id="taskFrom" required></select>
                    </div>
                    <div class="form-group">
                        <label>接收者 (身份) *</label>
                        <select id="taskTo" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>任务内容 *</label>
                    <textarea id="taskContent" placeholder="描述任务详情" required></textarea>
                </div>
                <div class="form-group">
                    <label>任务截止时间</label>
                    <input type="datetime-local" id="taskDeadline" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="hideModal('taskModal')">取消</button>
                    <button type="submit" class="btn btn-primary">发送</button>

    <!-- ===== 模态框：任务清单 ===== -->
    <div class="modal-overlay task-list-modal" id="taskListModal">
        <div class="modal">
            <h2>
                📋 任务清单
                <button class="close-btn" onclick="hideModal('taskListModal')">✕</button>
            </h2>
            <div class="form-group">
                <label>查看谁的任务？</label>
                <select id="taskListFilter" onchange="App.renderTaskList()">
                    <option value="">-- 请选择 --</option>
                </select>
            </div>
            <div id="taskListContainer" style="margin-top:16px;max-height:400px;overflow-y:auto;">
                <p style="color:#94a3b8;text-align:center;padding:30px 0;">请选择一位小人查看任务</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="hideModal('taskListModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- JavaScript (适配你现有字段名) -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  1. YesApi 配置（已从你的截图获取）
        // ================================================================
        const APP_KEY = '48840E74CC44E952482803AF2B5D7393';
        const API_BASE = 'http://hn.api.yesapi.net/';

        // 通用 API 调用函数（增加 where 参数）
        async function callYesApi(service, params = {}) {
            // 强制为 Query 接口添加 where 参数
            if (service === 'App.Table.Query' && !params.where) {
                params.where = '{}';
            }
            const query = new URLSearchParams({
                s: service,
                app_key: APP_KEY,
                ...params
            });
            const url = API_BASE + '?' + query;
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.ret === 200) {
                    return result.data;
                } else {
                    console.error('API 错误:', result);
                    throw new Error(result.msg || '调用失败');
                }
            } catch (e) {
                console.error('网络请求失败:', e);
                throw e;
            }
        }

        // ================================================================
        //  2. 数据存储层（适配字段名）
        // ================================================================
        const Store = {
            async loadAllData() {
                try {
                    const [projects, persons, tasks] = await Promise.all([
                        callYesApi('App.Table.Query', { model_name: 'projects' }),
                        callYesApi('App.Table.Query', { model_name: 'persons' }),
                        callYesApi('App.Table.Query', { model_name: 'tasks' })
                    ]);
                    // 注意数据结构：可能 data.list 或 data.data，兼容处理
                    const projList = projects.list || projects.data || [];
                    const persList = persons.list || persons.data || [];
                    const taskList = tasks.list || tasks.data || [];
                    return { projects: projList, persons: persList, tasks: taskList };
                } catch (e) {
                    console.error('加载数据失败', e);
                    return { projects: [], persons: [], tasks: [] };
                }
            },

            // 创建项目 - 映射字段名
            async addProject(data) {
                const params = {
                    model_name: 'projects',
                    data_item_name: data.name,        // 对应字段 item_name
                    data_startDate: data.startDate || '',
                    data_endDate: data.endDate || '',
                    data_requirements: data.requirements || ''
                };
                const result = await callYesApi('App.Table.Create', params);
                return { id: result.id, ...data };
            },

            async deleteProject(id) {
                await callYesApi('App.Table.Delete', { model_name: 'projects', id: id });
                return true;
            },

            async addPerson(data) {
                const params = {
                    model_name: 'persons',
                    data_personname: data.name        // 对应字段 personname
                };
                const result = await callYesApi('App.Table.Create', params);
                return { id: result.id, ...data };
            },

            async updatePerson(id, data) {
                await callYesApi('App.Table.Update', {
                    model_name: 'persons',
                    id: id,
                    data_personname: data.name
                });
                return true;
            },

            async deletePerson(id) {
                await callYesApi('App.Table.Delete', { model_name: 'persons', id: id });
                return true;
            },

            async addTask(data) {
                const params = {
                    model_name: 'tasks',
                    data_fromPersonId: data.fromPersonId,   // 字段名 fromPersonId（注意大小写）
                    data_toPersonId: data.toPersonId,
                    data_content: data.content,
                    data_deadline: data.deadline || '',
                    data_book_status: '待完成'               // 字段名 book_status
                };
                const result = await callYesApi('App.Table.Create', params);
                return { id: result.id, ...data, status: '待完成' };
            },

            async updateTask(id, data) {
                await callYesApi('App.Table.Update', {
                    model_name: 'tasks',
                    id: id,
                    data_book_status: data.status        // 状态字段 book_status
                });
                return true;
            }
        };

        // ================================================================
        //  3. 应用主逻辑 (完全沿用之前的渲染逻辑，字段读取时映射)
        // ================================================================
        const App = {
            projects: [],
            persons: [],
            tasks: [],
            searchKeyword: '',

            async init() {
                await this.syncData();
                this.renderAll();
                setInterval(() => this.syncData(), 5000);
                setInterval(() => this.renderProjects(), 60000);
                document.getElementById('projectSearch').addEventListener('input', (e) => {
                    this.searchKeyword = e.target.value.trim();
                    this.renderProjects();
                    this.updateCounts();
                });
                document.getElementById('syncStatus').textContent = '🟢 在线';
            },

            async syncData() {
                try {
                    const data = await Store.loadAllData();
                    this.projects = data.projects;
                    this.persons = data.persons;
                    this.tasks = data.tasks;
                    this.renderAll();
                    document.getElementById('syncStatus').textContent = '🟢 在线';
                } catch (e) {
                    console.warn('同步失败', e);
                    document.getElementById('syncStatus').textContent = '⚠️ 同步失败';
                    document.getElementById('syncStatus').className = 'status-indicator offline';
                }
            },

            renderAll() {
                this.renderProjects();
                this.renderPersonsAndSelects();
                this.renderPersonManage();
                this.updateCounts();
                if (document.getElementById('taskListModal').classList.contains('active')) {
                    this.renderTaskList();
                }
            },

            _formatDateTime(dateStr) {
                if (!dateStr) return null;
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d)) return dateStr;
                    return d.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (e) {
                    return dateStr;
                }
            },

            _escape(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },

            // ---- 项目大屏（读取 item_name 作为 name） ----
            renderProjects() {
                const grid = document.getElementById('projectGrid');
                const now = new Date();
                const keyword = this.searchKeyword.toLowerCase();

                // 将 item_name 映射为 name，方便后续处理
                const mappedProjects = this.projects.map(p => ({
                    ...p,
                    name: p.item_name || p.name || ''
                }));

                let filtered = mappedProjects;
                if (keyword) {
                    filtered = mappedProjects.filter(p => p.name && p.name.toLowerCase().includes(keyword));
                }

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">🔍</span>
                            <p>${keyword ? '未找到匹配的项目' : '暂无项目，点击「发布项目」创建第一个'}</p>
                        </div>
                    `;
                    document.getElementById('projectCount').textContent = `${filtered.length} 个项目`;
                    return;
                }

                const groups = { pending: [], open: [], closed: [], undefined: [] };
                filtered.forEach(p => {
                    const start = p.startDate ? new Date(p.startDate) : null;
                    const end = p.endDate ? new Date(p.endDate) : null;
                    if (!start || !end) {
                        groups.undefined.push(p);
                        return;
                    }
                    let status;
                    if (now < start) status = 'pending';
                    else if (now >= start && now <= end) status = 'open';
                    else status = 'closed';
                    groups[status].push(p);
                });

                const sortByEnd = (a, b) => {
                    const endA = a.endDate ? new Date(a.endDate) : new Date(8640000000000000);
                    const endB = b.endDate ? new Date(b.endDate) : new Date(8640000000000000);
                    return endA - endB;
                };
                groups.pending.sort(sortByEnd);
                groups.open.sort(sortByEnd);
                groups.closed.sort(sortByEnd);
                groups.undefined.sort((a, b) => a.name.localeCompare(b.name));

                const statusMap = {
                    pending: { label: '📌 待申报', class: 'status-pending' },
                    open: { label: '📌 申报中', class: 'status-open' },
                    closed: { label: '📌 已截止', class: 'status-closed' },
                    undefined: { label: '⏳ 时间未设定', class: 'status-undefined' }
                };

                let html = '';
                ['pending', 'open', 'closed', 'undefined'].forEach(key => {
                    const items = groups[key];
                    if (items.length === 0) return;
                    html += `<div class="group-title">${statusMap[key].label} (${items.length})</div>`;
                    items.forEach(p => {
                        const statusText = key === 'pending' ? '待申报' : key === 'open' ? '申报中' : key ===
                            'closed' ? '已截止' : '时间未设定';
                        const startDisplay = this._formatDateTime(p.startDate);
                        const endDisplay = this._formatDateTime(p.endDate);
                        const timeDisplay = (startDisplay && endDisplay) ?
                            `📅 ${startDisplay}  ~  ${endDisplay}` :
                            '⏳ 时间未设定';
                        html += `
                            <div class="project-card">
                                <div class="p-name">${this._escape(p.name)}</div>
                                <div class="p-meta"><span>${timeDisplay}</span></div>
                                <div class="p-req">📌 ${this._escape(p.requirements || '无硬性要求')}</div>
                                <span class="p-status ${statusMap[key].class}">${statusText}</span>
                                <div class="p-actions">
                                    <button class="btn btn-danger btn-xs" onclick="App.deleteProject('${p.id}')">删除</button>
                                </div>
                            </div>
                        `;
                    });
                });

                grid.innerHTML = html;
                document.getElementById('projectCount').textContent = `${filtered.length} 个项目`;
            },

            // ---- 任务清单 ----
            renderTaskList() {
                const sel = document.getElementById('taskListFilter');
                const personId = sel.value;
                const container = document.getElementById('taskListContainer');

                if (!personId) {
                    container.innerHTML =
                        `<p style="color:#94a3b8;text-align:center;padding:30px 0;">请选择一位小人查看任务</p>`;
                    return;
                }

                const person = this.persons.find(p => p.id === personId);
                if (!person) {
                    container.innerHTML = `<p style="color:#94a3b8;text-align:center;padding:30px 0;">该小人不存在</p>`;
                    return;
                }

                const tasks = this.tasks.filter(t => t.toPersonId === personId);
                if (tasks.length === 0) {
                    container.innerHTML =
                        `<p style="color:#94a3b8;text-align:center;padding:30px 0;">📭 ${this._escape(person.personname || person.name)} 暂无任务</p>`;
                    return;
                }

                // 任务状态字段是 book_status
                const pending = tasks.filter(t => t.book_status !== '已完成');
                const done = tasks.filter(t => t.book_status === '已完成');

                pending.sort((a, b) => {
                    if (!a.deadline) return 1;
                    if (!b.deadline) return -1;
                    return new Date(a.deadline) - new Date(b.deadline);
                });
                done.sort((a, b) => {
                    if (!a.deadline) return 1;
                    if (!b.deadline) return -1;
                    return new Date(b.deadline) - new Date(a.deadline);
                });

                const renderItems = (items, title, emoji) => {
                    if (items.length === 0) return '';
                    let html = `<div style="margin-top:16px;"><span class="task-group-title">${emoji} ${title} (${items.length})</span></div>`;
                    items.forEach(t => {
                        const from = this.persons.find(p => p.id === t.fromPersonId);
                        const fromName = from ? (from.personname || from.name) : '已删除';
                        const deadlineDisplay = t.deadline ? this._formatDateTime(t.deadline) : '⏳ 无时限';
                        const isDone = t.book_status === '已完成';
                        const detailId = 'taskDetail_' + t.id;
                        html += `
                            <div class="task-item" onclick="App.toggleTaskDetail('${detailId}')">
                                <div class="task-head">
                                    <span class="task-from">📤 ${this._escape(fromName)}</span>
                                    <span class="task-deadline">📅 ${deadlineDisplay}</span>
                                    <span class="task-status-badge ${isDone ? 'done' : ''}">${isDone ? '✅ 已完成' : '⏳ 待完成'}</span>
                                </div>
                                <div class="task-content">${this._escape(t.content)}</div>
                                <div class="task-detail-popup" id="${detailId}">
                                    <div><span class="label">发布者：</span>${this._escape(fromName)}</div>
                                    <div><span class="label">内容：</span>${this._escape(t.content)}</div>
                                    <div><span class="label">截止时间：</span>${deadlineDisplay}</div>
                                    <div style="margin-top:10px;display:flex;gap:10px;">
                                        ${!isDone ? `<button class="btn btn-success btn-xs" onclick="event.stopPropagation();App.completeTask('${t.id}')">✅ 标记完成</button>` : ''}
                                        <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();App.deleteTask('${t.id}')">🗑️ 删除</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    return html;
                };

                const personName = person.personname || person.name || '未知';
                let html = `<div style="margin-bottom:8px;font-weight:700;font-size:18px;">🧑 ${this._escape(personName)} 的任务</div>`;
                html += renderItems(pending, '未完成', '⏳');
                html += renderItems(done, '已完成', '✅');
                container.innerHTML = html;
            },

            // ---- 小人相关渲染（persons 表字段 personname） ----
            renderPersonsAndSelects() {
                this.renderPersons();
                this.renderTaskSelects();
                this.renderTaskListFilter();
            },

            renderPersons() {
                const container = document.getElementById('小人列表');
                if (this.persons.length === 0) {
                    container.innerHTML = `<span style="color:#94a3b8;font-size:13px;">暂无小人</span>`;
                    return;
                }
                const colors = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
                let html = '';
                this.persons.forEach((p, idx) => {
                    const color = colors[idx % colors.length];
                    const name = p.personname || p.name || '';
                    html += `
                        <span class="小人标签" title="点击查看任务清单" onclick="App.viewTaskList('${p.id}')">
                            <span class="dot" style="background:${color};"></span>
                            ${this._escape(name)}
                        </span>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('小人Count').textContent = this.persons.length;
            },

            renderTaskSelects() {
                const fromSel = document.getElementById('taskFrom');
                const toSel = document.getElementById('taskTo');
                const options = this.persons.map(p => {
                    const name = p.personname || p.name || '';
                    return `<option value="${p.id}">${this._escape(name)}</option>`;
                }).join('');
                fromSel.innerHTML = options;
                toSel.innerHTML = options;
            },

            renderTaskListFilter() {
                const sel = document.getElementById('taskListFilter');
                const options = this.persons.map(p => {
                    const name = p.personname || p.name || '';
                    return `<option value="${p.id}">${this._escape(name)}</option>`;
                }).join('');
                sel.innerHTML = `<option value="">-- 请选择 --</option>` + options;
            },

            renderPersonManage() {
                const container = document.getElementById('小人管理列表');
                if (this.persons.length === 0) {
                    container.innerHTML = `<p style="color:#94a3b8;">暂无小人</p>`;
                    return;
                }
                let html = '';
                this.persons.forEach(p => {
                    const name = p.personname || p.name || '';
                    html += `
                        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;background:#f8fafc;padding:10px 16px;border-radius:14px;">
                            <span style="font-weight:600;min-width:32px;">${this._escape(name)}</span>
                            <input type="text" value="${this._escape(name)}" 
                                   style="flex:1;padding:8px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;background:white;"
                                   onchange="App.updatePersonName('${p.id}', this.value)" />
                            <button class="btn btn-danger btn-xs" onclick="App.deletePerson('${p.id}')">删除</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            },

            updateCounts() {
                const keyword = this.searchKeyword.toLowerCase();
                let count = this.projects.filter(p => {
                    const name = p.item_name || p.name || '';
                    return keyword ? name.toLowerCase().includes(keyword) : true;
                });
                document.getElementById('projectCount').textContent = `${count.length} 个项目`;
                document.getElementById('小人Count').textContent = this.persons.length;
            },

            // ---- 业务操作 ----
            async submitProject(e) {
                e.preventDefault();
                const name = document.getElementById('pName').value.trim();
                const startDate = document.getElementById('pStart').value;
                const endDate = document.getElementById('pEnd').value;
                const requirements = document.getElementById('pReq').value.trim();

                if (!name) {
                    toast('项目名称不能为空', 'error');
                    return;
                }
                try {
                    await Store.addProject({ name, startDate, endDate, requirements });
                    await this.syncData();
                    hideModal('projectModal');
                    document.getElementById('projectForm').reset();
                    toast('✅ 项目发布成功！', 'success');
                } catch (err) {
                    toast('发布失败，请重试', 'error');
                    console.error(err);
                }
            },

            async deleteProject(id) {
                if (!confirm('确定删除这个项目吗？')) return;
                try {
                    await Store.deleteProject(id);
                    await this.syncData();
                    toast('已删除项目', 'success');
                } catch (err) {
                    toast('删除失败', 'error');
                }
            },

            async addPerson() {
                const input = document.getElementById('new小人Name');
                const name = input.value.trim();
                if (!name) {
                    toast('请输入小人名称', 'error');
                    return;
                }
                if (this.persons.some(p => (p.personname || p.name) === name)) {
                    toast('该名称已存在，请换一个', 'error');
                    return;
                }
                try {
                    await Store.addPerson({ name });
                    await this.syncData();
                    input.value = '';
                    toast('✅ 已添加小人', 'success');
                } catch (err) {
                    toast('添加失败，请重试', 'error');
                    console.error(err);
                }
            },

            async updatePersonName(id, newName) {
                newName = newName.trim();
                if (!newName) {
                    toast('名称不能为空', 'error');
                    return;
                }
                if (this.persons.some(p => p.id !== id && (p.personname || p.name) === newName)) {
                    toast('该名称已存在', 'error');
                    return;
                }
                try {
                    await Store.updatePerson(id, { name: newName });
                    await this.syncData();
                    toast('已更新名称', 'success');
                } catch (err) {
                    toast('更新失败', 'error');
                }
            },

            async deletePerson(id) {
                if (!confirm('确定删除这个小人和相关任务吗？')) return;
                try {
                    await Store.deletePerson(id);
                    await this.syncData();
                    toast('已删除小人', 'success');
                } catch (err) {
                    toast('删除失败', 'error');
                }
            },

            async submitTask(e) {
                e.preventDefault();
                const fromPersonId = document.getElementById('taskFrom').value;
                const toPersonId = document.getElementById('taskTo').value;
                const content = document.getElementById('taskContent').value.trim();
                const deadline = document.getElementById('taskDeadline').value;

                if (!fromPersonId || !toPersonId) {
                    toast('请选择发送者和接收者', 'error');
                    return;
                }
                if (!content) {
                    toast('请输入任务内容', 'error');
                    return;
                }
                try {
                    await Store.addTask({ fromPersonId, toPersonId, content, deadline });
                    await this.syncData();
                    hideModal('taskModal');
                    document.getElementById('taskForm').reset();
                    toast('✅ 任务已发送！', 'success');
                } catch (err) {
                    toast('发送失败，请重试', 'error');
                    console.error(err);
                }
            },

            viewTaskList(personId) {
                const sel = document.getElementById('taskListFilter');
                sel.value = personId;
                showModal('taskListModal');
                this.renderTaskList();
            },

            toggleTaskDetail(id) {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('open');
            },

            async completeTask(id) {
                try {
                    await Store.updateTask(id, { status: '已完成' });
                    await this.syncData();
                    toast('✅ 任务已完成！', 'success');
                } catch (err) {
                    toast('操作失败', 'error');
                }
            },

            async deleteTask(id) {
                if (!confirm('确定删除这个任务吗？')) return;
                try {
                    await Store.updateTask(id, { status: '已删除' });
                    await this.syncData();
                    toast('已删除任务', 'success');
                } catch (err) {
                    toast('删除失败', 'error');
                }
            }
        };

        // ================================================================
        //  4. UI 辅助
        // ================================================================
        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function hideModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });

        let toastTimer;

        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast';
            if (type === 'success') el.classList.add('success');
            if (type === 'error') el.classList.add('error');
            clearTimeout(toastTimer);
            void el.offsetWidth;
            el.classList.add('show');
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        window.App = App;
        window.showModal = showModal;
        window.hideModal = hideModal;
        window.toast = toast;

        document.addEventListener('DOMContentLoaded', () => App.init());
        console.log('🚀 任务平台已启动 (适配你的表单字段)');
    </script>
</body>
</html>
